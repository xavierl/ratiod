services:
  ratiod:
    build: .
    image: ratiod:local
    container_name: ratiod
    restart: unless-stopped
    ports:
      - "5081:5081"     # web interface
      - "49200:49200"   # peer port announced to trackers
    volumes:
      - ./data:/data
    environment:
      RUST_LOG: info
      # RATIOD_AUTOSTART: "false"
    stop_grace_period: 15s
